<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="食事記録" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="style.css" />
  <title>食事記録</title>
</head>
<body>
  <main class="app-shell">
    <section id="recordView" class="view active" aria-labelledby="recordTitle">
      <header class="topbar">
        <h1 id="recordTitle">記録</h1>
      </header>

      <div class="content">
        <label class="field-label" for="mealDate">日付</label>
        <input id="mealDate" class="date-input" type="date" />

        <section class="section-block">
          <div class="section-head">
            <h2>食事の写真</h2>
            <span class="required-badge">必須</span>
          </div>

          <div id="photoPreviewWrap" class="photo-preview empty">
            <img id="photoPreview" alt="選択した食事写真" hidden />
            <div id="photoPlaceholder" class="photo-placeholder">
              <div class="camera-mark" aria-hidden="true">📷</div>
              <p>食事の写真を撮影してください</p>
            </div>
          </div>

          <div class="photo-actions">
            <button id="cameraButton" class="action-button primary" type="button">写真を撮影</button>
            <button id="libraryButton" class="action-button secondary" type="button">写真を選択</button>
          </div>

          <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
          <input id="libraryInput" type="file" accept="image/*" hidden />
        </section>

        <section class="section-block">
          <label class="field-label" for="ingredients">食材名とグラム数 <span class="optional">（任意）</span></label>
          <textarea id="ingredients" rows="6" placeholder="・鶏むね肉 150g\n・ブロッコリー 80g\n・白米 200g"></textarea>
        </section>

        <button id="saveButton" class="save-button" type="button">登録する</button>
        <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section id="historyView" class="view" aria-labelledby="historyTitle">
      <header class="topbar">
        <h1 id="historyTitle">確認</h1>
      </header>

      <div class="content history-content">
        <div class="history-toolbar">
          <button id="prevDay" class="icon-button" type="button" aria-label="前の日">‹</button>
          <input id="historyDate" class="date-input history-date" type="date" />
          <button id="nextDay" class="icon-button" type="button" aria-label="次の日">›</button>
        </div>

        <div class="date-strip" id="dateStrip" aria-label="日付一覧"></div>

        <section>
          <h2 id="historyHeading" class="history-heading"></h2>
          <div id="mealList" class="meal-list"></div>
          <div id="emptyState" class="empty-state" hidden>
            <div class="empty-icon">🍽️</div>
            <p>この日の記録はありません</p>
          </div>
        </section>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <button class="nav-item active" data-view="record" type="button">
      <span class="nav-icon">＋</span>
      <span>記録</span>
    </button>
    <button class="nav-item" data-view="history" type="button">
      <span class="nav-icon">▣</span>
      <span>確認</span>
    </button>
  </nav>

  <template id="mealCardTemplate">
    <article class="meal-card">
      <img class="meal-image" alt="食事写真" />
      <div class="meal-meta">
        <time class="meal-time"></time>
        <div class="meal-ingredients"></div>
      </div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
